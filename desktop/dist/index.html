      const repos=[

      function projectsView(){return `<div class="gallery"><div class="gallery-toolbar"><h1>Projects</h1><span class="mono" style="font-size:9px;color:#8a95a1">PUBLIC REPOSITORIES</span></div><div class="filter-row">${['All','Game','Payments','Social','Web3'].map((x,i)=>`<button class="filter-chip ${i===0?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="project-grid" id="projectGrid">${projectCards()}</div></div>`}
      function githubView(){return `<div class="github-page"><div class="github-header"><span class="github-mark">⌘</span><strong>GitHub</strong><span>Public profile</span></div><div class="profile-banner"><img src="${profile.avatar}" alt="llins GitHub avatar"><div><h1>llins</h1><p>JavaScript · SQL · Cairo · Open source</p><a href="https://github.com/llinsss" target="_blank" rel="noreferrer">github.com/llinsss ↗</a></div></div><div class="gh-repos"><div class="gh-repos-top"><strong>Selected repositories</strong><span>6 shown</span></div><input class="gh-search" id="ghSearch" placeholder="Find a repository…" aria-label="Search repositories"><div class="gh-repo-list" id="ghRepoList">${repos.map(r=>`<a class="gh-repo" href="${r.href}" target="_blank" rel="noreferrer"><strong>${r.name}</strong><p>${r.description}</p><small>${r.tags.join(' · ')}</small></a>`).join('')}</div></div></div>`}
      function safariView(){return `<div class="safari"><div class="safari-controls"><button aria-label="Back" type="button">‹</button><button aria-label="Forward" type="button">›</button><button aria-label="Reload" type="button" id="safariReload">↻</button><div class="safari-address"><span>◉</span><span id="safariAddress">github.com/llinsss</span><span style="margin-left:auto">⌕</span></div><button aria-label="Share" type="button" id="safariShare">↑</button></div><div class="safari-body"><div class="safari-home"><h1>Start somewhere.</h1><p>Public links connected to my GitHub projects.</p><div class="browser-links"><a class="browser-link" href="https://github.com/llinsss" target="_blank" rel="noreferrer"><span>⌘</span><strong>GitHub profile</strong><small>github.com/llinsss</small></a><a class="browser-link" href="https://lyricsflip.xyz" target="_blank" rel="noreferrer"><span>♫</span><strong>LyricFlip</strong><small>lyricsflip.xyz</small></a><a class="browser-link" href="https://taggedpay.xyz" target="_blank" rel="noreferrer"><span>↗</span><strong>TaggedPay</strong><small>taggedpay.xyz</small></a><a class="browser-link" href="https://github.com/llinsss?tab=repositories" target="_blank" rel="noreferrer"><span>▦</span><strong>All repositories</strong><small>github.com/llinsss?tab=repositories</small></a></div><div class="browser-callout"><b>A live page from a project</b><p>LyricFlip is a music guessing game experiment connected to Starknet.</p><a href="https://lyricsflip.xyz" target="_blank" rel="noreferrer">Visit lyricsflip.xyz ↗</a></div></div></div></div>`}
      const notes=[{title:'A little about me',subtitle:'Profile note',content:`<p>${profile.bio}</p><p>My public projects range from music games to payment and social experiments. I like learning by making things, and leaving the work somewhere others can explore it.</p><div class="note-footer">SOURCE · GITHUB PROFILE README</div>`},{title:'What I’m exploring',subtitle:'Currently',content:`<p>Things I keep coming back to:</p><ul><li>JavaScript and full-stack product work</li><li>SQL and the shape of useful data</li><li>Cairo and on-chain applications</li><li>Open-source collaboration</li><li>Data analysis with R — currently learning</li></ul><div class="note-footer">UPDATED · FROM MY PUBLIC PROFILE</div>`},{title:'Contact',subtitle:'Pinned note',content:`<p>For a project, collaboration, or a question, email me here:</p><p><a href="mailto:${profile.email}">${profile.email}</a></p><p>You can also find the code and project history on my GitHub profile.</p><p><a href="https://github.com/llinsss" target="_blank" rel="noreferrer">github.com/llinsss ↗</a></p><div class="note-footer">SENT FROM A VERY SMALL NOTES APP</div>`}];
      function notesView(index=0){return `<div class="notes-app"><aside class="notes-list"><h2>Notes</h2>${notes.map((n,i)=>`<button class="note-pick ${i===index?'active':''}" data-note="${i}">${n.title}<small>${n.subtitle}</small></button>`).join('')}</aside><article class="note-paper"><span class="note-date">${notes[index].subtitle}</span><h1>${notes[index].title}</h1>${notes[index].content}</article></div>`}
      function terminalView(output='Welcome to the llins desktop.\nThis is a small local demo — commands are simulated, nothing runs on your device.') {return `<div class="terminal"><div class="terminal-head"><span>zsh — llins@portfolio</span><span>⌕ &nbsp; ⋯</span></div><div class="terminal-output" id="terminalOutput">${output}</div><div class="terminal-input"><label>llins@portfolio ~ %</label><input id="termInput" autocomplete="off" spellcheck="false" aria-label="Simulated terminal command" placeholder="type help"></div><div class="terminal-buttons"><button data-cmd="help">help</button><button data-cmd="ls">ls</button><button data-cmd="profile">profile</button><button data-cmd="projects">projects</button><button data-cmd="clear">clear</button></div></div>`}
      function contactView(){return `<div class="contact-app"><div class="contact-card"><img src="${profile.avatar}" alt="llins GitHub avatar"><h1>llins</h1><p>Software builder · @llinsss</p><a class="email" href="mailto:${profile.email}">${profile.email}</a><div class="contact-buttons"><a class="primary" href="mailto:${profile.email}">Send an email ↗</a><a href="https://github.com/llinsss" target="_blank" rel="noreferrer">GitHub profile</a></div></div></div>`}
      function getContent(id){if(id==='finder')return finderView();if(id==='projects')return projectsView();if(id==='safari')return safariView();if(id==='notes')return notesView();if(id==='github')return githubView();if(id==='terminal')return terminalView();return contactView()}
      function setActive(id){active=id;activeName.textContent=appInfo[id]?.[0]||'Finder';document.querySelectorAll('.dock-item[data-open]').forEach(b=>b.classList.toggle('active',b.dataset.open===id&&!!layer.querySelector(`[data-app="${id}"]`)))}
      function createWindow(id){const app=appInfo[id];if(!app)return;const node=document.createElement('section');node.className='app-window';node.dataset.app=id;node.style.zIndex=String(++topZ);node.innerHTML=`<header class="window-titlebar"><div class="traffic"><button class="close" aria-label="Close window"></button><button class="min" aria-label="Minimize window"></button><button class="max" aria-label="Maximize window"></button></div><span class="window-title">${app[0]}</span></header><div class="window-body ${id==='terminal'?'dark':''}">${getContent(id)}</div>`;layer.append(node);windowCount++;setActive(id);wireWindow(node);wireContent(node,id);}
      function openApp(id){let node=layer.querySelector(`[data-app="${id}"]`);if(!node){createWindow(id);return}if(node.dataset.minimized==='true'){node.dataset.minimized='false';node.style.display='flex'}node.style.zIndex=String(++topZ);setActive(id)}
      function closeWindow(node){const id=node.dataset.app;node.remove();if(!layer.querySelector('[data-app]')){active='finder';activeName.textContent='Finder'}else{const highest=[...layer.querySelectorAll('.app-window')].filter(x=>x.dataset.minimized!=='true').sort((a,b)=>Number(b.style.zIndex)-Number(a.style.zIndex))[0];if(highest)setActive(highest.dataset.app)}document.querySelectorAll(`.dock-item[data-open="${id}"]`).forEach(x=>x.classList.remove('active'))}
      function wireWindow(node){node.addEventListener('pointerdown',()=>{node.style.zIndex=String(++topZ);setActive(node.dataset.app)});const title=node.querySelector('.window-titlebar');let drag=null;title.addEventListener('pointerdown',e=>{if(e.target.closest('.traffic'))return;if(node.classList.contains('maximized'))return;const rect=node.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:rect.left,top:rect.top};title.setPointerCapture(e.pointerId)});title.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;node.style.left=`${Math.max(15,Math.min(innerWidth-120,drag.left+dx))}px`;node.style.top=`${Math.max(34,Math.min(innerHeight-100,drag.top+dy))}px`;node.style.transform='none'});title.addEventListener('pointerup',()=>drag=null);title.addEventListener('pointercancel',()=>drag=null);node.querySelector('.close').addEventListener('click',()=>closeWindow(node));node.querySelector('.min').addEventListener('click',()=>{node.dataset.minimized='true';node.style.display='none';document.querySelector(`.dock-item[data-open="${node.dataset.app}"]`)?.classList.remove('active')});node.querySelector('.max').addEventListener('click',()=>node.classList.toggle('maximized'))}
      function wireContent(node,id){
        node.querySelectorAll('[data-finder-tab]').forEach(b=>b.addEventListener('click',()=>{node.querySelector('.window-body').innerHTML=finderView(b.dataset.finderTab);wireContent(node,id)}));
        node.querySelectorAll('[data-app-open]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();openApp(b.dataset.appOpen)}));
        node.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{node.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');node.querySelector('#projectGrid').innerHTML=projectCards(b.dataset.filter,node.querySelector('#projectSearch')?.value||'')}));
        node.querySelectorAll('[data-note]').forEach(b=>b.addEventListener('click',()=>{node.querySelector('.window-body').innerHTML=notesView(Number(b.dataset.note));wireContent(node,id)}));
        const gs=node.querySelector('#ghSearch');if(gs)gs.addEventListener('input',()=>{const q=gs.value.toLowerCase().trim();const matches=repos.filter(r=>`${r.name} ${r.title} ${r.description} ${r.tags.join(' ')}`.toLowerCase().includes(q));node.querySelector('#ghRepoList').innerHTML=matches.map(r=>`<a class="gh-repo" href="${r.href}" target="_blank" rel="noreferrer"><strong>${r.name}</strong><p>${r.description}</p><small>${r.tags.join(' · ')}</small></a>`).join('')||'<div class="gh-empty">No repositories match that search.</div>'});
        node.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>runCommand(node,b.dataset.cmd)));const input=node.querySelector('#termInput');if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter')runCommand(node,input.value)});
        const share=node.querySelector('#safariShare');if(share)share.addEventListener('click',()=>toast('Share my GitHub','Open the GitHub profile link to share my public work.'));
      }
      function runCommand(node,raw){const input=node.querySelector('#termInput');const out=node.querySelector('#terminalOutput');const cmd=(raw||'').trim().toLowerCase();if(input)input.value='';let result='';if(cmd==='help')result='Available commands: help, ls, profile, projects, clear\nAll commands are simulated.';else if(cmd==='ls')result='about.md   projects/   skills.md   contact.txt';else if(cmd==='profile')result='@llinsss\nInterested in JavaScript, SQL, Cairo, and open source.\nCurrently learning data analysis with R.';else if(cmd==='projects')result=repos.map(r=>r.name).join('   ');else if(cmd==='clear'){out.textContent='';return}else result=`command not found: ${cmd||'(empty)'}\nType help to see the available demo commands.`;out.textContent=`llins@portfolio ~ % ${cmd}\n${result}`}
      function toast(title,message){const el=document.getElementById('toast');el.querySelector('strong').textContent=title;el.querySelector('p').textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),4200)}
      document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.open)));
      document.getElementById('appleMenu').addEventListener('click',()=>toast('llins desktop','A small portfolio built around public GitHub projects.'));
      document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.menu;if(name==='File')openApp('finder');else if(name==='View')openApp('projects');else if(name==='Window')openApp('github');else toast('Edit','Select text or search a project to get started.')}));
      const lock=document.getElementById('lockscreen'),unlock=document.getElementById('unlock');function doUnlock(){if(lock.classList.contains('unlocked'))return;lock.classList.add('unlocked');setTimeout(()=>{lock.hidden=true;toast('Welcome to my desktop','Open an app from the dock to explore projects, notes, and links from my GitHub.');openApp('finder')},560)}unlock.addEventListener('click',doUnlock);let startY=null;lock.addEventListener('pointerdown',e=>{startY=e.clientY;lock.setPointerCapture?.(e.pointerId)});lock.addEventListener('pointerup',e=>{if(startY!==null&&startY-e.clientY>35)doUnlock();startY=null});document.addEventListener('keydown',e=>{if(!lock.classList.contains('unlocked')&&(e.key==='Enter'||e.key===' '||e.key==='ArrowUp')){e.preventDefault();doUnlock()}else if(e.key==='Escape'){const visible=[...layer.querySelectorAll('.app-window')].filter(x=>x.dataset.minimized!=='true').sort((a,b)=>Number(b.style.zIndex)-Number(a.style.zIndex))[0];if(visible)closeWindow(visible)}});
      function updateClock(){const d=new Date(),time=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d),long=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(d),short=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(d);document.getElementById('lockTime').textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',hour12:false}).format(d);document.getElementById('lockDate').textContent=long;document.getElementById('topDate').textContent=short;document.getElementById('topTime').textContent=time}updateClock();setInterval(updateClock,10000);
    })();
  </script>
</body>
</html>
